<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="myteam-api" content="https://myteam-backend-eu.onrender.com">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://myteam-backend-eu.onrender.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>МАЙТИМ</title>
  <link rel="stylesheet" href="myteam/static/myteam/app.css?v=20261025-spa">
  <link rel="stylesheet" href="web/app.css?v=20261025-spa">
  <script src="myteam/static/myteam/interactions.js" defer></script>
  <script src="web/app.js?v=20261025-spa" defer></script>
</head>
<body>
<div id="app">
  <header>
    <a class="brand" href="#/" aria-label="МАЙТИМ — главная">МАЙТИМ ·</a>
    <nav id="account-nav" aria-label="Разделы" hidden>
      <button class="icon-button" type="button" data-open="history" aria-label="История" title="История"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7M3 5v6h6M12 7v5l3 2"/></svg></button>
      <button class="icon-button" type="button" data-open="profile" aria-label="Профиль" title="Профиль"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></button>
    </nav>
  </header>
  <main id="main">
    <div class="setup"><p class="eyebrow">Знакомство · 1 из 3</p><h1>Знакомься с коллегами</h1><section class="card"><p>МАЙТИМ помогает узнавать людей за пределами своей команды — через разговоры, игры и встречи по интересам.</p><button type="button" data-intro-next>Дальше</button></section></div>
  </main>
  <footer>Небольшой эксперимент для нашей команды. Иногда что-то может работать неидеально — если заметишь проблему, дай знать.</footer>
</div>
<dialog id="panel" aria-labelledby="panel-title">
  <div class="panel-header"><h1 id="panel-title"></h1><button type="button" id="panel-close" class="icon-button" aria-label="Вернуться к активностям" title="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div id="panel-content"></div>
</dialog>
<template id="tpl-intro"><div class="setup"><p class="eyebrow" data-step></p><h1 data-heading></h1><section class="card"><p data-body></p><button type="button" data-intro-next>Дальше</button></section><div data-auth-message></div></div></template>
<template id="tpl-loading"><div class="loading-state" role="status"><span class="spinner" aria-hidden="true"></span><span>Загружаем…</span></div></template>
<template id="tpl-error"><section class="card load-error"><p class="error" role="alert">Не удалось загрузить данные. Попробуй ещё раз.</p><button type="button" data-retry>Повторить</button></section></template>
<template id="tpl-activities"><h1>Активности</h1><div id="activity-content" aria-live="polite"><div class="weeks-grid"><section class="card current-week"><p class="eyebrow">Текущая неделя</p><div class="loading-state" role="status"><span class="spinner" aria-hidden="true"></span><span>Загружаем активность…</span></div></section><aside class="card next-week"><p class="eyebrow">Следующая неделя</p><p class="muted">Загружаем запись…</p></aside></div></div></template>
<template id="tpl-weeks"><div class="weeks-grid"><section class="card current-week"><p class="eyebrow">Текущая неделя</p><p class="muted" data-current-dates></p><div data-current-body></div></section><aside class="card next-week"><p class="eyebrow">Следующая неделя</p><h2 data-next-dates></h2><div data-next-body></div><p class="muted fine-print">Участие добровольное. Запись только на эту неделю, без автоматического продления.</p></aside></div></template>
<template id="tpl-active"><h2 data-title></h2><h3>Кто участвует</h3><ul class="participants" data-participants></ul><h3>Что делать на этой неделе</h3><p data-instructions></p><a class="button secondary" data-contacts>Связаться через Telegram</a><div class="activity-result"><h3>Как всё прошло?</h3><p class="muted">Когда проведёшь активность, поделись результатом — это поможет сделать следующие недели интереснее.</p><button type="button" data-feedback>Поделиться результатом</button></div></template>
<template id="tpl-login"><div class="setup"><button class="text-button" type="button" data-back-intro>← Назад</button><h1>Вход через Telegram</h1><div data-login-content></div></div></template>
<template id="tpl-code"><section class="card"><p>Сравни этот код с кодом в сообщении бота и подтверди вход в чате.</p><p class="login-code" data-code></p><a class="button" data-bot target="_blank" rel="noopener">Открыть Telegram</a><p class="muted fine-print" data-login-status>После подтверждения вернись сюда — вход завершится автоматически.</p><button class="secondary" type="button" data-new-code hidden>Получить новый код</button></section></template>
<template id="tpl-profile"><div class="profile-grid"><section class="card"><h2 data-profile-heading>Твои данные</h2><form data-profile-form><div data-form-message></div><p><label for="profile-name">Как вас зовут</label><input id="profile-name" name="full_name" autocomplete="name" maxlength="250" required><span class="error" data-field-error="full_name" hidden></span></p><p><label for="profile-team">Команда</label><input id="profile-team" name="team" maxlength="200" required><span class="error" data-field-error="team" hidden></span></p><p><label for="profile-city">Город, где вы сейчас</label><input id="profile-city" name="city" maxlength="150" required><span class="error" data-field-error="city" hidden></span></p><button type="submit" data-submit>Сохранить</button></form></section><section class="card" data-achievements><h2>Достижения</h2><div data-awards></div><button type="button" class="secondary" data-logout>Выйти</button></section></div></template>
<template id="tpl-history-item"><section class="card history-entry"><div><h2 data-title></h2><p class="muted" data-dates></p></div><div data-result></div></section></template>
<template id="tpl-feedback"><section class="card"><p data-activity></p><div data-readonly hidden></div><form data-activity-feedback><div data-form-message></div><fieldset class="outcome-choice"><legend>Получилось провести активность?</legend><div id="id_outcome"><label><input type="radio" name="outcome" value="yes" required>Да</label><label><input type="radio" name="outcome" value="no" required>Нет</label></div><span class="error" data-field-error="outcome" hidden></span></fieldset><div data-rating-panel hidden><fieldset class="rating-choice"><legend>Оцените активность</legend><div class="star-options"><label class="star-option"><input type="radio" name="rating" value="1"><span aria-hidden="true">★</span><span class="sr-only">1 из 5</span></label><label class="star-option"><input type="radio" name="rating" value="2"><span aria-hidden="true">★</span><span class="sr-only">2 из 5</span></label><label class="star-option"><input type="radio" name="rating" value="3"><span aria-hidden="true">★</span><span class="sr-only">3 из 5</span></label><label class="star-option"><input type="radio" name="rating" value="4"><span aria-hidden="true">★</span><span class="sr-only">4 из 5</span></label><label class="star-option"><input type="radio" name="rating" value="5"><span aria-hidden="true">★</span><span class="sr-only">5 из 5</span></label></div><span class="error" data-field-error="rating" hidden></span></fieldset></div><div data-comment-panel hidden><label for="result-comment" data-comment-label>Комментарий (необязательно)</label><textarea id="result-comment" name="comment" rows="3" maxlength="3000"></textarea><span class="error" data-field-error="comment" hidden></span></div><button type="submit" data-submit>Сохранить результат</button></form><p class="muted fine-print">Ответ виден только тебе и организатору, не другим участникам.</p></section></template>
<noscript><main><p>Для входа и работы МАЙТИМ включите JavaScript в браузере.</p></main></noscript>
</body></html>
