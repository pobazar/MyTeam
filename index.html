<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="myteam-api" content="https://myteam-backend-eu.onrender.com">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://myteam-backend-eu.onrender.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>МАЙТИМ</title>
  <link rel="stylesheet" href="web/tokens.css?v=20261025-coffee">
  <link rel="stylesheet" href="web/app.css?v=20261025-coffee">
  <link rel="stylesheet" href="web/appbar.css?v=20261025-coffee">
  <link rel="stylesheet" href="web/toasts.css?v=20261025-coffee">
  <script src="web/toasts.js?v=20261025-coffee" defer></script>
  <script src="myteam/static/myteam/interactions.js?v=20261025-coffee" defer></script>
  <script src="web/app.js?v=20261025-coffee" defer></script>
</head>
<body>
<div id="app" data-view="intro">
  <header class="appbar">
    <div class="appbar-inner">
    <button id="screen-back" type="button" class="back-button" aria-label="Вернуться к активностям" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span>Назад</span></button>
    <progress id="intro-progress" class="intro-progress" max="3" value="1" aria-label="Шаг знакомства" hidden></progress>
    <span id="appbar-title" aria-hidden="true" hidden></span>
    <a class="brand" href="#/" aria-label="МАЙТИМ — главная">МАЙТИМ ·</a>
    <nav id="account-nav" aria-label="Разделы" hidden>
      <button class="icon-button" type="button" data-open="history" aria-label="История" title="История"><img src="web/icons/doc-clock.svg" width="24" height="24" alt=""></button>
      <button class="icon-button" type="button" data-open="profile" aria-label="Профиль" title="Профиль"><img src="web/icons/user-impersonal.svg" width="24" height="24" alt=""></button>
    </nav>
    </div>
  </header>
  <main id="main">
    <div class="intro-flow"><div class="intro-image"><div class="intro-art" aria-hidden="true"><span>М</span><span>Ы</span></div></div><div class="intro-content"><p class="sr-only" data-step>Знакомство · 1 из 3</p><h1 data-heading tabindex="-1">Знакомься с коллегами</h1><p data-body>МАЙТИМ помогает узнавать людей за пределами своей команды — через разговоры, игры и встречи по интересам.</p></div><div class="intro-actions"><button type="button" data-intro-next>Дальше</button><div data-auth-message></div></div></div>
  </main>
  <main id="screen" hidden tabindex="-1"><h1 id="screen-title" class="sr-only" tabindex="-1"></h1><div id="screen-content" aria-live="polite"></div></main>
  <footer>Небольшой эксперимент для нашей команды. Иногда что-то может работать неидеально — если заметишь проблему, дай знать.</footer>
</div>
<dialog id="panel" aria-labelledby="panel-title">
  <div class="panel-header appbar-detail" data-modal="true"><h1 id="panel-title"></h1><button type="button" id="panel-close" class="icon-button" aria-label="Закрыть оценку" title="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div id="panel-content"></div>
</dialog>
<template id="tpl-intro"><div class="intro-flow"><div class="intro-image"><div class="intro-art" aria-hidden="true"><span>М</span><span>Ы</span></div></div><div class="intro-content"><p class="sr-only" data-step>Знакомство · 1 из 3</p><h1 data-heading tabindex="-1">Знакомься с коллегами</h1><p data-body>МАЙТИМ помогает узнавать людей за пределами своей команды — через разговоры, игры и встречи по интересам.</p></div><div class="intro-actions"><button type="button" data-intro-next>Дальше</button><div data-auth-message></div></div></div></template>
<template id="tpl-loading"><div class="loading-state" role="status" aria-label="Загрузка данных"><span class="skeleton" aria-hidden="true"></span><span class="skeleton skeleton-short" aria-hidden="true"></span></div></template>
<template id="tpl-error"><section class="card load-error"><p role="alert">Не удалось загрузить данные. Попробуй ещё раз.</p><button type="button" data-retry>Повторить</button></section></template>
<template id="tpl-activities"><h1>Активности</h1><div id="activity-content" aria-live="polite"><div class="weeks-grid"><section class="card current-week"><p class="eyebrow">Текущая активность</p><div class="loading-state" role="status" aria-label="Загрузка данных"><span class="skeleton" aria-hidden="true"></span><span class="skeleton skeleton-short" aria-hidden="true"></span></div></section><aside class="card next-week"><p class="eyebrow">Следующая активность</p><div class="loading-state" role="status" aria-label="Загрузка следующей активности"><span class="skeleton" aria-hidden="true"></span></div></aside></div></div></template>
<template id="tpl-weeks"><div class="weeks-grid"><section class="card current-week"><p class="eyebrow">Текущая активность</p><p class="muted" data-current-dates></p><div data-current-body></div></section><aside class="card next-week"><p class="eyebrow">Следующая активность</p><h2 data-next-dates></h2><div data-next-body></div></aside></div></template>
<template id="tpl-active"><h2 data-title></h2><h3>Кто участвует</h3><ul class="participants" data-participants></ul><h3>Что делать на этой неделе</h3><p data-instructions></p><div class="activity-result"><h3>Как всё прошло?</h3><p class="muted">Когда проведёшь активность, поделись результатом — это поможет сделать следующие недели интереснее.</p><button type="button" data-feedback>Поделиться результатом</button></div></template>
<template id="tpl-login"><div class="setup"><h1 class="sr-only" tabindex="-1">Авторизация</h1><div data-login-content></div></div></template>
<template id="tpl-code"><section class="card"><p>Сравни этот код с кодом в сообщении бота и подтверди вход в чате.</p><p class="login-code" data-code></p><a class="button" data-bot target="_blank" rel="noopener">Открыть Telegram</a><p class="muted fine-print" data-login-status>После подтверждения вернись сюда — вход завершится автоматически.</p><button class="secondary" type="button" data-new-code hidden>Получить новый код</button></section></template>
<template id="tpl-profile"><div class="profile-page"><div class="profile-grid"><section class="card"><h2 data-profile-heading>Твои данные</h2><form data-profile-form><div data-form-message></div><p><label for="profile-name">Как вас зовут</label><input id="profile-name" name="full_name" autocomplete="name" maxlength="250" required><span class="error" data-field-error="full_name" hidden></span></p><p><label for="profile-team">Команда</label><input id="profile-team" name="team" maxlength="200" required><span class="error" data-field-error="team" hidden></span></p><p><label for="profile-city">Город, где вы сейчас</label><input id="profile-city" name="city" maxlength="150" required><span class="error" data-field-error="city" hidden></span></p><button type="submit" data-submit>Сохранить</button></form></section><section class="card" data-achievements><h2 class="achievements-heading">Мои достижения <span data-awards-count></span></h2><div class="achievements-grid" data-awards></div></section></div><div class="profile-actions" data-profile-actions><button type="button" class="secondary" data-logout>Выйти</button></div></div></template>
<template id="tpl-profile-loading"><div class="profile-grid" aria-busy="true"><section class="card"><h2>Твои данные</h2><div role="status" aria-label="Загрузка данных профиля"><div class="skeleton-field"><span class="skeleton skeleton-label"></span><span class="skeleton skeleton-input"></span></div><div class="skeleton-field"><span class="skeleton skeleton-label"></span><span class="skeleton skeleton-input"></span></div><div class="skeleton-field"><span class="skeleton skeleton-label"></span><span class="skeleton skeleton-input"></span></div><span class="skeleton skeleton-button"></span></div></section><section class="card"><h2>Мои достижения</h2><div class="achievements-grid" role="status" aria-label="Загрузка достижений"><span class="skeleton skeleton-badge"></span></div></section></div></template>
<template id="tpl-achievement"><button type="button" class="achievement-badge"><img src="web/images/achievements/first-coffee.png" width="112" height="112" loading="lazy" decoding="async" alt=""></button></template>
<template id="tpl-history-item"><section class="card history-entry"><div><h2 data-title></h2><p class="muted" data-dates></p></div><div data-result></div></section></template>
<template id="tpl-feedback"><section class="card"><p data-activity></p><div data-readonly hidden></div><form data-activity-feedback><div data-form-message></div><input type="hidden" name="outcome" value=""><fieldset class="outcome-choice" data-outcome-choice><legend>Получилось провести активность?</legend><div class="outcome-buttons"><button type="button" class="secondary" data-outcome="yes">Да</button><button type="button" class="secondary" data-outcome="no">Нет</button></div><span class="error" data-field-error="outcome" hidden></span></fieldset><div class="outcome-summary" data-outcome-summary hidden><p data-outcome-label tabindex="-1"></p><button type="button" class="text-button" data-change-outcome>Изменить ответ</button></div><div data-rating-panel hidden><fieldset class="rating-choice"><legend>Оцените активность</legend><div class="star-options"><label class="star-option"><input type="radio" name="rating" value="1"><span aria-hidden="true"><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span><span class="sr-only">1 из 5</span></label><label class="star-option"><input type="radio" name="rating" value="2"><span aria-hidden="true"><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span><span class="sr-only">2 из 5</span></label><label class="star-option"><input type="radio" name="rating" value="3"><span aria-hidden="true"><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span><span class="sr-only">3 из 5</span></label><label class="star-option"><input type="radio" name="rating" value="4"><span aria-hidden="true"><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span><span class="sr-only">4 из 5</span></label><label class="star-option"><input type="radio" name="rating" value="5"><span aria-hidden="true"><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span><span class="sr-only">5 из 5</span></label></div><span class="error" data-field-error="rating" hidden></span></fieldset></div><div data-comment-panel hidden><label for="result-comment" data-comment-label>Комментарий (необязательно)</label><textarea id="result-comment" name="comment" rows="3" maxlength="3000"></textarea><span class="error" data-field-error="comment" hidden></span></div><button type="submit" data-submit hidden>Отправить</button></form><p class="muted fine-print">Ответ виден только тебе и организатору, не другим участникам.</p></section></template>
<template id="tpl-rating-result"><span class="stars-result" role="img"><span data-rating-star><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span><span data-rating-star><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span><span data-rating-star><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span><span data-rating-star><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span><span data-rating-star><img class="star-idle" src="web/icons/star-idle.svg" width="40" height="40" alt=""><img class="star-active" src="web/icons/star-active.svg" width="40" height="40" alt=""></span></span></template>
<dialog id="achievement-dialog" aria-labelledby="achievement-title" aria-describedby="achievement-description"><button type="button" class="achievement-close icon-button" aria-label="Закрыть достижение"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><img id="achievement-image" width="176" height="176" alt=""><p id="achievement-date" class="muted"></p><h2 id="achievement-title"></h2><p id="achievement-description"></p></dialog>
<div id="toast-host" popover="manual" role="status" aria-live="polite" aria-atomic="false" aria-relevant="additions"></div>
<template id="tpl-toast"><div class="toast"><svg class="toast-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><path data-toast-success d="m7 12 3 3 7-7"/><path data-toast-error d="m8 8 8 8m0-8-8 8" hidden/></svg><span class="toast-message"></span><button type="button" class="toast-dismiss" aria-label="Закрыть уведомление"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg></button></div></template>
<noscript><main><p>Для входа и работы МАЙТИМ включите JavaScript в браузере.</p></main></noscript>
</body></html>
