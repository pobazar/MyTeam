# Frontend: GitHub Pages. Backend: Frankfurt, near the Supabase database in Paris.
# Scheduled events run through GitHub Actions; no paid Render cron is required.
services:
  - type: web
    name: myteam-backend-eu
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_round && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health/live
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: APP_ENV
        value: production
      - key: SEND_TELEGRAM
        value: 'true'
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        value: https://pobazar.github.io/MyTeam
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
