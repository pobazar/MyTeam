name: Weekly MyTeam events
on:
  schedule:
    # GitHub cron uses UTC; Moscow is UTC+3 year-round.
    - cron: '0 6 * * 2'   # Tue 09:00 MSK: one feedback request
    - cron: '0 18 * * 2'  # Tue 21:00 MSK: close + prepare + owner report
    - cron: '0 6 * * 3'   # Wed 09:00 MSK: publish activities
    - cron: '30 6 * * 3'  # Wed 09:30 MSK: idempotent recovery if the first run was missed
    - cron: '5 12 * * 3'  # Wed 15:05 MSK: finalize failed publication and notify participants
    - cron: '0 6 * * 4'   # Thu 09:00 MSK: invite users not enrolled
  workflow_dispatch:
    inputs:
      event:
        description: 'Event to run; verify checks access without changing data or sending messages'
        type: choice
        options: [verify, feedback, prepare, publish, invite]
        default: verify
      round_date:
        description: 'Optional Wednesday YYYY-MM-DD to recover a specific round within its allowed time window'
        type: string
        required: false
      invite_at:
        description: 'Optional one-off UTC time, e.g. 2026-10-26T15:00:00Z; invite only, within one hour'
        type: string
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ inputs.invite_at && format('myteam-delayed-invite-{0}', github.run_id) || 'myteam-weekly-events' }}
  cancel-in-progress: false
jobs:
  events:
    if: github.ref == 'refs/heads/main' && !inputs.invite_at
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run due events and recover temporary delivery failures
        run: python scripts/run_schedule.py
        env:
          MYTEAM_SCHEDULE: ${{ github.event.schedule }}
          MYTEAM_EVENT: ${{ inputs.event || 'verify' }}
          MYTEAM_ROUND_DATE: ${{ inputs.round_date }}

  delayed-invite:
    if: github.event_name == 'workflow_dispatch' && inputs.invite_at != ''
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for requested time and dispatch the normal main invite event
        run: python scripts/delayed_invite.py
        env:
          GH_TOKEN: ${{ github.token }}
          MYTEAM_EVENT: ${{ inputs.event }}
          MYTEAM_ROUND_DATE: ${{ inputs.round_date }}
          MYTEAM_INVITE_AT: ${{ inputs.invite_at }}
