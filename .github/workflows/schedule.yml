name: Weekly MyTeam events
on:
  schedule:
    # UTC, Moscow UTC+3. Avoid the busy start of the hour; all attempts use
    # the same idempotent event. No polling, clock override or automatic enrollment.
    - cron: '7 6 * * 2'    # Tue 09:07 MSK: feedback
    - cron: '23 6 * * 2'   # Tue 09:23 MSK: feedback recovery
    - cron: '47 6 * * 2'   # Tue 09:47 MSK: feedback recovery
    - cron: '7 18 * * 2'   # Tue 21:07 MSK: close + prepare + owner report
    - cron: '23 18 * * 2'  # Tue 21:23 MSK: preparation recovery
    - cron: '47 18 * * 2'  # Tue 21:47 MSK: preparation recovery
    - cron: '7 6 * * 3'    # Wed 09:07 MSK: publish
    - cron: '23 6 * * 3'   # Wed 09:23 MSK: publication recovery
    - cron: '47 6 * * 3'   # Wed 09:47 MSK: publication recovery
    - cron: '7 12 * * 3'   # Wed 15:07 MSK: finalize missed publication
    - cron: '7 6 * * 4'    # Thu 09:07 MSK: invite
    - cron: '23 6 * * 4'   # Thu 09:23 MSK: invitation recovery
    - cron: '47 6 * * 4'   # Thu 09:47 MSK: invitation recovery
  workflow_dispatch:
    inputs:
      event:
        description: 'Event to run; verify checks access without changing data or sending messages'
        type: choice
        options: [verify, feedback, prepare, publish, invite]
        default: verify
      round_date:
        description: 'Optional Wednesday YYYY-MM-DD to recover a specific round within its allowed time window'
        type: string
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  # A slow/offline stage must not hold the backup or another event in the queue.
  # Distinct triggers may overlap; backend transactions/outbox leases handle this.
  group: myteam-weekly-${{ github.event.schedule || inputs.event || 'verify' }}
  cancel-in-progress: false
jobs:
  events:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run due events and recover temporary delivery failures
        run: python scripts/run_schedule.py
        env:
          MYTEAM_SCHEDULE: ${{ github.event.schedule }}
          MYTEAM_EVENT: ${{ inputs.event || 'verify' }}
          MYTEAM_ROUND_DATE: ${{ inputs.round_date }}
          MYTEAM_RUN_ID: ${{ github.run_id }}
          PYTHONUNBUFFERED: '1'
